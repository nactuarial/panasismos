name: Actualizar catálogo IGC-UP
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: igc-up-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_igc.py
      - name: Publicar copia del boletín
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/igc-up.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar boletín IGC-UP'
            git push
          fi
